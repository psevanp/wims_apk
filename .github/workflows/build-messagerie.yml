name: Construire l'APK Messagerie

on:
  push:
    branches: [main]
    paths:
      - "messagerie-apk/**"
      - ".github/workflows/build-messagerie.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: messagerie-apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          build-root-directory: messagerie-apk

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk messagerie-education.apk

      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: messagerie-latest
          name: Messagerie Éducation (dernière version)
          files: messagerie-apk/messagerie-education.apk
          make_latest: false
